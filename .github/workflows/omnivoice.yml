name: omnivoice

on:
  workflow_dispatch:
    inputs:
      row:
        description: "Row number in PIPELINE_VIDEO_KARAOKE!TASKS (>= 2)"
        required: true
      pdf_link:
        description: "PDF link from Column A (optional when stage=voiceover)"
        required: false
        default: ""
      project_name:
        description: "Project folder name or Drive Folder URL (Column C)"
        required: true
      stage:
        description: "voiceover (primary — Mushu handles prepare/html) | prepare | html | auto"
        required: false
        default: "voiceover"
      chunk_start:
        description: "Starting chunk index (checkpoint resume)"
        required: false
        default: "0"
      num_step:
        description: "OmniVoice diffusion steps (16 fast, 32 standard)"
        required: false
        default: "32"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: omni-row-${{ inputs.row || 'schedule-poll' }}
  cancel-in-progress: false

env:
  HF_HOME: ${{ github.workspace }}/.hf
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      GH_TOKEN: ${{ secrets.GH_DISPATCH_PAT }}
      BRIDGE_UPLOAD_URL: ${{ secrets.BRIDGE_UPLOAD_URL }}
      BRIDGE_UPLOAD_SECRET: ${{ secrets.BRIDGE_UPLOAD_SECRET }}
      OMNI_SOFT_LIMIT_MIN: "225"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Install Python packages
        run: |
          python -m pip install -q --upgrade pip
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            pip install -q google-api-python-client google-auth
          elif [[ "${{ inputs.stage }}" == "prepare" || "${{ inputs.stage }}" == "html" ]]; then
            pip install -q pymupdf google-api-python-client google-auth soundfile numpy
          else
            pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
            pip install -q -r requirements.txt
          fi

      - name: Backup poll Gdrive rows on schedule
        if: github.event_name == 'schedule'
        run: python scripts/gcommon.py poll-gdrive-rows --max-dispatch 5

      - name: Cache OmniVoice HuggingFace weights
        if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'voiceover' || inputs.stage == 'auto')
        uses: actions/cache@v4
        with:
          path: .hf
          key: pdfkara-omnivoice-hf-v1

      - name: Download Peter reference WAV from Drive
        if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'voiceover' || inputs.stage == 'auto')
        run: python scripts/gcommon.py download-voice --out peter_ref.wav

      - name: Run requested stage
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_ROW: ${{ inputs.row }}
          IN_PDF: ${{ inputs.pdf_link }}
          IN_PROJ: ${{ inputs.project_name }}
          IN_STAGE: ${{ inputs.stage }}
          IN_START: ${{ inputs.chunk_start }}
          IN_STEP: ${{ inputs.num_step }}
        run: |
          case "${IN_STAGE}" in
            prepare)
              python -u scripts/prepare.py --row "${IN_ROW}" --pdf "${IN_PDF}" --project "${IN_PROJ}"
              ;;
            voiceover)
              python -u scripts/voiceover.py --row "${IN_ROW}" --project "${IN_PROJ}" --start "${IN_START:-0}" --num-step "${IN_STEP:-32}" --ref-audio peter_ref.wav
              ;;
            html)
              python -u scripts/build_html.py --row "${IN_ROW}" --project "${IN_PROJ}"
              ;;
            auto)
              python -u scripts/prepare.py --row "${IN_ROW}" --pdf "${IN_PDF}" --project "${IN_PROJ}"
              python -u scripts/voiceover.py --row "${IN_ROW}" --project "${IN_PROJ}" --start "${IN_START:-0}" --num-step "${IN_STEP:-32}" --ref-audio peter_ref.wav
              python -u scripts/build_html.py --row "${IN_ROW}" --project "${IN_PROJ}" --dispatch-render
              ;;
            *)
              echo "Unsupported stage: ${IN_STAGE}" >&2
              exit 1
              ;;
          esac

      - name: Checkpoint continuation dispatch if soft-limit reached
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.stage == 'voiceover' || inputs.stage == 'auto')
        env:
          IN_ROW: ${{ inputs.row }}
        run: python scripts/gcommon.py checkpoint-dispatch --row "${IN_ROW}" --state-file work/checkpoint_state.json
